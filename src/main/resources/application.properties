spring.application.name=centro-artes-musicales-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/centro_artes_musicales}
spring.datasource.username=root
spring.datasource.password=cedam_mx
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# app.* -> config/AppProperties.java
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap.nombre=${ADMIN_BOOTSTRAP_NOMBRE:Administrador}

app.timezone=${APP_TIMEZONE:America/Mexico_City}

app.clases.limite-mensual=${CLASES_LIMITE_MENSUAL:4}
app.clases.horas-minimas-reagendar=${CLASES_HORAS_MINIMAS_REAGENDAR:4}
app.clases.duracion-default-minutos=${CLASES_DURACION_DEFAULT_MINUTOS:60}

app.pagos.monto-mensual-default=${PAGOS_MONTO_MENSUAL_DEFAULT:600.00}