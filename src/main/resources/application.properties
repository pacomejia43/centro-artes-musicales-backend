spring.application.name=centro-artes-musicales-backend

# Railway (and most PaaS) assign the port dynamically via $PORT; 8080 is only the local fallback.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/centro_artes_musicales}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# app.* -> config/AppProperties.java
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap.nombre=${ADMIN_BOOTSTRAP_NOMBRE:Administrador}

app.timezone=${APP_TIMEZONE:America/Mexico_City}

app.clases.limite-mensual=${CLASES_LIMITE_MENSUAL:4}
app.clases.horas-minimas-reagendar=${CLASES_HORAS_MINIMAS_REAGENDAR:4}
app.clases.duracion-default-minutos=${CLASES_DURACION_DEFAULT_MINUTOS:60}

app.pagos.monto-mensual-default=${PAGOS_MONTO_MENSUAL_DEFAULT:600.00}

# Sin defaults para las claves: si faltan, StripeConfig lo deja arrancar (a diferencia de
# DB_PASSWORD/JWT_SECRET) pero StripeService rechaza cualquier operación con un mensaje claro,
# para no tumbar el backend completo mientras todavía no se configura Stripe en Railway.
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Base pública del frontend (sin slash final) — el backend arma success_url/cancel_url de
# Stripe Checkout a partir de esto, porque Stripe necesita URLs completas, no rutas relativas.
app.frontend-url=${FRONTEND_URL:https://cedam.vercel.app}

server.forward-headers-strategy=framework